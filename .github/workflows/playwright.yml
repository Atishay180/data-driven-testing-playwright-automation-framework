name: Playwright Tests

on:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch:          # manual "Run workflow" button

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (only the browser you use)
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          EXCEL_FILE_NAME: ${{ vars.EXCEL_FILE_NAME }}
          SHEET_NAME: ${{ vars.SHEET_NAME }}
          MAX_PARALLEL_EXECUTIONS: ${{ vars.MAX_PARALLEL_EXECUTIONS }}

      # Your Excel report + per-test-case screenshots (reports/<date>/...)
      - name: Upload execution reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      # Playwright's own HTML report + traces for failed rows
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14